##
## -----------------------
## | N A S - D O C K E R |
## -----------------------
##
## Container based media tools configuration
##
## -- DO NOT EDIT THIS FILE --
##
## Configuration items for this file are taken from the .env file
##
## Have docker-compose.yml and .env in the same directory to launch the stack

version: '3'

######################
# SERVICES TO LAUNCH #
######################

services:
  # ----------------------------------------
  # ORGANIZR
  # Web Frontend for Management
  # ----------------------------------------
  organizr:
    image: organizr/organizr
    container_name: organizr
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${ORGANIZR_PORT}:80'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/organizr:/config'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # DELUGEVPN
  # Deluge Torrent Client + VPN
  # ----------------------------------------
  arch-delugevpn:
    image: binhex/arch-delugevpn
    container_name: delugevpn
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${DELUGE_PORT}:8112'
      - '8118:8118'
      - '58846:58846'
      - '58946:58946'
    cap_add:
      - NET_ADMIN
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - VPN_ENABLED=yes
      - VPN_USER=${VPNUNAME}
      - VPN_PASS=${VPNPASS}
      - VPN_REMOTE=${VPN_REMOTE}
      - VPN_PORT=1198
      - VPN_PROTOCOL=udp
      - VPN_DEVICE_TYPE=tun
      - VPN_PROV=${VPNPROVIDER}
      - STRONG_CERTS=no
      - ENABLE_PRIVOXY=yes
      - STRICT_PORT_FORWARD=yes
      - LAN_NETWORK=${CIDR_ADDRESS}
      - NAME_SERVERS=37.235.1.174,8.8.8.8,37.235.1.177,8.8.4.4
      - DEBUG=false
    volumes:
      - '${TORRENTS_PATH}:/data'
      - '${SYNOLOGY_BASE_DOCKER_PATH}/delugevpn/config:/config'
      - '${SYNOLOGY_BASE_DOCKER_PATH}/ovpn/${VPNPROVIDER}:/config/openvpn'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8112/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  # ----------------------------------------
  # SONARR
  # TV Series Management
  # ----------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${SONARR_PORT}:8989'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/sonarr:/config'
      - '${TORRENTS_PATH}/Completed:/data/Completed'
      - '${MEDIA_BASE_PATH}/TVShows:/tv'
      - '${MEDIA_BASE_PATH}/Kid TV:/kidtv'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # RADARR
  # Movie Management
  # ----------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${RADARR_PORT}:7878'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/radarr:/config'
      - '${TORRENTS_PATH}/Completed:/data/Completed'
      - '${MEDIA_BASE_PATH}/Movies:/movies'
      - '${MEDIA_BASE_PATH}/Kid Movies:/kidmovies'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # RADARR 4K
  # Movie Management
  # ----------------------------------------
  radarr4k:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr4k
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${RADARR_4K_PORT}:7878'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/radarr4k:/config'
      - '${TORRENTS_PATH}/Completed:/data/Completed'
      - '${MEDIA_BASE_PATH}/Movies4k:/movies4k'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # CALIBRE-WEB AUTOMATED
  # E-book Management and Automation
  # ----------------------------------------
  calibre-web-automated:
    image: ghcr.io/new-usemame/calibre-web-nextgen:latest
    container_name: calibre-web-automated
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${CALIBRE_WEB_PORT}:8083'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - HARDCOVER_TOKEN=${HARDCOVER_TOKEN}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/calibre-web:/config'
      - '${MEDIA_BASE_PATH}/Books/temp:/cwa-book-ingest'
      - '${MEDIA_BASE_PATH}/Books:/calibre-library'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8083"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ----------------------------------------
  # JACKETT
  # RSS/TORZNAB Feed Creator
  # ----------------------------------------
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${JACKETT_PORT}:9117'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/jackett:/config'
      - '${TORRENTS_PATH}/Completed:/downloads'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117/UI/Dashboard"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # TAUTULLI
  # Monitoring Service for PLEX Usage
  # ----------------------------------------
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${TAUTULLI_PORT}:8181'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/tautulli:/config'
      - '${SYNOLOGY_PLEX_PATH}/AppData/Plex Media Server/Logs:/logs:ro'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8181/status || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------
  # Seerr
  # Request Service for Plex Content
  # ----------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${SEERR_PORT}:5055'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - LOG_LEVEL=info
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/seerr:/app/config'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  # ----------------------------------------
  # Profilarr
  # Profile Updater for Sonarr/Radarr
  # ----------------------------------------
  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${PROFILARR_PORT}:6868'
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/profilarr:/config'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6868/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # SHELFMARK
  # Book Downloader and Manager
  # ----------------------------------------
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    network_mode: "container:gluetun"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - '${SYNOLOGY_BASE_DOCKER_PATH}/shelfmark:/config'
      - '${SYNOLOGY_BASE_DOCKER_PATH}/calibre-web/app.db:/auth/app.db'
      - '${MEDIA_BASE_PATH}/Books:/books'
      - '${TORRENTS_PATH}/Completed:/downloads'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------
  # FLARESOLVERR
  # Proxy server to bypass Cloudflare protection
  # ----------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-file: '${LOG_FILE_NUM}'
        max-size: '${LOG_FILE_SIZE}'
    ports:
      - '${FLARESOLVERR_PORT}:8191'
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

